{% extends "base.html" %}

{% block title %}Dashboard · MindSpace{% endblock %}
{% block hero_title %}Your journal dashboard{% endblock %}
{% block header_action %}
  <button id="logout" class="ghost">Sign out</button>
{% endblock %}

{% block content %}
  <section class="card" id="journal-card">
    <h2 id="entry-form-title">New entry</h2>
    <input id="entry-id" type="hidden" />
    <label for="title">Title</label>
    <input id="title" placeholder="A moment to remember" />
    <label for="text">Entry</label>
    <textarea id="text" placeholder="What is on your mind?"></textarea>
    <label for="image-upload">Inline image (Markdown)</label>
    <div class="row">
      <input id="image-upload" type="file" accept="image/*" />
      <button id="upload-image" class="ghost" type="button">Upload image</button>
    </div>
    <p class="small">Uploads insert Markdown like ![alt](url) at your cursor.</p>
    <label for="tags">Tags (comma separated)</label>
    <input id="tags" placeholder="focus, gratitude, growth" />
    <div class="row" style="margin-top: 16px;">
      <button id="save">Save entry</button>
      <button id="update" class="ghost">Update entry</button>
      <button id="cancel-edit" class="ghost">Cancel</button>
    </div>
    <p id="entry-message" class="small"></p>
  </section>

  <section class="card" id="entries-card">
    <div class="row">
      <div>
        <h2>Your entries</h2>
        <p class="small" id="summary"></p>
      </div>
      <button id="refresh" class="ghost">Refresh</button>
      <button id="export" class="ghost">Export CSV</button>
    </div>
    <label for="search">Search</label>
    <input id="search" placeholder="Search text or title" />
    <label for="tag-filter">Filter by tag</label>
    <select id="tag-filter">
      <option value="">All tags</option>
    </select>
    <div class="entries" id="entries"></div>
  </section>
{% endblock %}
