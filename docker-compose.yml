version: "3.8"
services:
  web:
    build: .
    environment:
      - PORT=8080
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mindspace
      - POSTGRES_USER=mindspace
      - POSTGRES_PASSWORD=mindspace
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/static/uploads
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=mindspace
      - POSTGRES_USER=mindspace
      - POSTGRES_PASSWORD=mindspace
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  uploads_data:
